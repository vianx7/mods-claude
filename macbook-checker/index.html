<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MacBook Checker</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1f232c; --line:#2a2f3a; --text:#e8eaf0; --muted:#9aa1b2;
  --ok:#34c759; --fail:#ff453a; --warn:#ffb020; --accent:#4c8dff; --key:#232833; --keyon:#1f6f3a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:#3d4452}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.ok{background:rgba(52,199,89,.15);border-color:var(--ok)}
button.fail{background:rgba(255,69,58,.15);border-color:var(--fail)}
button:disabled{opacity:.5;cursor:default}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--line);padding:18px 10px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:17px;margin:0 8px 16px}
nav h1 small{display:block;font-weight:400;color:var(--muted);font-size:12px}
nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text);text-decoration:none;cursor:pointer}
nav a.active{background:var(--panel2)}
.navh{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 10px 4px}
.big{font-size:22px;font-weight:600}
.pill{display:inline-block;padding:4px 12px;border-radius:20px;background:var(--panel2);border:1px solid var(--line)}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.stat{display:flex;gap:28px;flex-wrap:wrap;margin:10px 0}
.stat div b{display:block;font-size:28px}
.stat div span{color:var(--muted);font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:#454b59;flex:none}
.dot.ok{background:var(--ok)} .dot.fail{background:var(--fail)} .dot.warn{background:var(--warn)}
main{padding:28px 36px 60px;max-width:1100px}
h2{margin:0 0 6px;font-size:24px}
.lead{color:var(--muted);margin:0 0 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.verdict{display:flex;gap:10px;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.verdict span{color:var(--muted);margin-right:6px}
table{border-collapse:collapse;width:100%}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--muted);width:42%}
.alert{border-radius:10px;padding:10px 14px;margin:8px 0;border:1px solid}
.alert.bad{border-color:var(--fail);background:rgba(255,69,58,.1)}
.alert.warn{border-color:var(--warn);background:rgba(255,176,32,.1)}
.alert.good{border-color:var(--ok);background:rgba(52,199,89,.1)}
.muted{color:var(--muted)}
code{background:var(--panel2);padding:2px 6px;border-radius:5px;font-size:13px}
pre{background:var(--panel2);padding:12px;border-radius:8px;overflow:auto;max-height:340px;font-size:12px}

/* teclado */
.kb{display:flex;flex-direction:column;gap:6px;background:#0b0d11;padding:14px;border-radius:12px;user-select:none}
.kr{display:flex;gap:6px}
.k{flex:1 1 0;min-width:0;height:46px;background:var(--key);border:1px solid #303644;border-radius:7px;display:flex;align-items:flex-end;justify-content:flex-start;padding:5px 7px;font-size:12px;color:#c9cedb;transition:background .12s}
.k.fn{height:30px;font-size:11px}
.k.on{background:var(--keyon);border-color:var(--ok);color:#fff}
.k.down{background:var(--ok);color:#000}
.k.opt{border-style:dashed}
.stack{flex:1 1 0;display:flex;flex-direction:column;gap:3px}
.stack .k{height:21.5px;padding:1px 6px;align-items:center;justify-content:center}
.progress{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;flex:1;min-width:120px}
.progress i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}
#keylog{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);min-height:20px}

/* trackpad */
.tp{position:relative;height:380px;border-radius:12px;border:1px solid var(--line);overflow:hidden;background:#0b0d11;touch-action:none}
.tp canvas{position:absolute;inset:0;width:100%;height:100%}
.tp .hint{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#555c6c;pointer-events:none}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:14px}
.chk{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--panel2)}
.chk.done{outline:1px solid var(--ok)}
.chk .dot{width:12px;height:12px}

/* tela cheia */
#screen{position:fixed;inset:0;z-index:99;display:none;cursor:none}
#screen .lbl{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:6px 14px;border-radius:20px;font-size:13px;transition:opacity .4s}
.swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.swatches i{width:36px;height:24px;border-radius:5px;border:1px solid var(--line)}

/* áudio/mic */
.meter{height:16px;background:var(--panel2);border-radius:8px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--warn) 70%,var(--fail))}
video{width:100%;max-width:640px;border-radius:10px;background:#000;transform:scaleX(-1)}

/* checklist manual */
.mitem{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mitem .t{flex:1}
.mitem .t small{display:block;color:var(--muted)}
.seg{display:flex;gap:4px}
.seg button{padding:4px 10px;font-size:13px}

/* relatório */
.rep td:last-child{text-align:right;white-space:nowrap}
.tag{padding:2px 9px;border-radius:12px;font-size:13px}
.tag.ok{background:rgba(52,199,89,.18);color:var(--ok)}
.tag.fail{background:rgba(255,69,58,.18);color:var(--fail)}
.tag.pending{background:var(--panel2);color:var(--muted)}
.tag.warn{background:rgba(255,176,32,.18);color:var(--warn)}

@media (max-width:820px){.app{grid-template-columns:1fr}nav{position:static;height:auto}main{padding:18px 16px}}
@media print{nav,.verdict,button{display:none!important}.app{display:block}body{background:#fff;color:#000}.card{border-color:#ccc;background:#fff}}
</style>
</head>
<body>
<div class="app">
  <nav id="nav">
    <h1>💻 MacBook Checker<small>teste antes de comprar</small></h1>
  </nav>
  <main id="main"></main>
</div>
<div id="screen"><div class="lbl" id="screenLbl"></div></div>

<script src="info.js" onerror="window.SYSINFO=null"></script>
<script>
"use strict";
/* ---------------- estado ---------------- */
const TESTS = [
  {id:"sistema",  name:"Sistema e bateria", icon:"🧾"},
  {id:"teclado",  name:"Teclado",           icon:"⌨️"},
  {id:"tela",     name:"Tela e cores",      icon:"🖥️"},
  {id:"trackpad", name:"Trackpad",          icon:"👆"},
  {id:"audio",    name:"Alto-falantes",     icon:"🔊"},
  {id:"mic",      name:"Microfone",         icon:"🎙️"},
  {id:"camera",   name:"Câmera",            icon:"📷"},
  {id:"extras",   name:"Portas e físico",   icon:"🔌"},
  {id:"travamentos",name:"Travamentos",     icon:"💥", adv:1},
  {id:"wifi",     name:"Velocidade Wi-Fi",  icon:"📶", adv:1},
  {id:"ssd",      name:"Velocidade do SSD", icon:"💾", adv:1},
  {id:"estresse", name:"Teste de estresse", icon:"🔥", adv:1},
  {id:"relatorio",name:"Relatório",         icon:"📋"},
];
const MANUAL = [
  ["charge","Carrega na tomada","Ícone de raio na bateria; teste o carregador que vem junto."],
  ["ports","Todas as portas USB-C / Thunderbolt","Teste carregar ou ligar um pendrive em CADA porta."],
  ["magsafe","MagSafe (se tiver)","A luz do conector acende e o Mac carrega."],
  ["jack","Saída de fone (P2)","Ligue um fone com fio e toque um som."],
  ["wifi","Wi-Fi conecta","Abra um site qualquer."],
  ["bt","Bluetooth encontra aparelhos","Ajustes do Sistema → Bluetooth: aparece seu celular/fone?"],
  ["touchid","Touch ID","Ajustes → Touch ID e Senha → adicionar digital."],
  ["backlight","Luz do teclado","Aumente/diminua no Centro de Controle num lugar escuro."],
  ["brightness","Brilho da tela","Vai do mínimo ao máximo sem piscar."],
  ["hinge","Dobradiça firme","A tela fica parada em qualquer ângulo, sem estalos."],
  ["body","Carcaça sem amassados","Fecha alinhado, sem tampa empenada, sem parafusos faltando."],
  ["coating","Tela sem manchas no antirreflexo","Com tela apagada, procure manchas/descascados."],
  ["fan","Ventoinha sem barulho estranho","Abra vários apps; não deve chiar nem raspar."],
  ["icloud","Sem conta iCloud do vendedor","Ajustes do Sistema → topo: ninguém logado; \"Buscar Mac\" desligado."],
  ["touchbar","Touch Bar (só MacBook Pro com Touch Bar)","Passe o dedo de ponta a ponta; tudo responde, sem manchas ou partes apagadas."],
  ["serial","Nº de série confere","O da aba Sistema bate com o gravado embaixo do Mac e com a caixa/nota."],
  ["liquid","Sem sinal de líquido","Lanterna do celular dentro das portas: nada de corrosão verde/branca."],
  ["diag","Apple Diagnostics sem erro","Desligue, segure o botão de ligar até \"Opções\", depois ⌘D. Anote o código se aparecer."],
];
let state = {results:{}, manual:{}, details:{}, notes:""};
try{ const s = JSON.parse(localStorage.getItem("mbc-state")||"null"); if(s) state = Object.assign(state,s); }catch(e){}
function save(){ try{ localStorage.setItem("mbc-state", JSON.stringify(state)); }catch(e){} renderNav(); }
function setResult(id, v){ state.results[id]=v; save(); const vd=document.querySelector(".verdict"); if(vd) vd.replaceWith(verdict(id)); }

let current = (location.hash||"#sistema").slice(1);
if(!TESTS.find(t=>t.id===current)) current="sistema";
let cleanup = null;

const $ = (s,el=document)=>el.querySelector(s);
const h = (html)=>{ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; };
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function statusOf(id){
  if(id==="extras"){
    const vals = MANUAL.map(m=>state.manual[m[0]]).filter(Boolean);
    if(vals.includes("fail")) return "fail";
    if(vals.length && vals.length === MANUAL.length) return "ok";
    return vals.length ? "warn" : "pending";
  }
  if(id==="relatorio") return "pending";
  return state.results[id] || "pending";
}
function renderNav(){
  const nav = $("#nav");
  nav.querySelectorAll("a,.navh").forEach(a=>a.remove());
  TESTS.forEach((t,i)=>{
    if(t.adv && !TESTS[i-1].adv) nav.appendChild(h(`<div class="navh">Avançado · deixe pro final</div>`));
    if(!t.adv && i && TESTS[i-1].adv) nav.appendChild(h(`<div class="navh">&nbsp;</div>`));
    const st = statusOf(t.id);
    const a = h(`<a class="${t.id===current?"active":""}"><span class="dot ${st==="pending"?"":st}"></span>${t.icon} ${t.name}</a>`);
    a.onclick = ()=>go(t.id);
    nav.appendChild(a);
  });
}
function verdict(id){
  const st = state.results[id];
  const el = h(`<div class="verdict"><span>Resultado:</span>
    <button class="${st==="ok"?"ok":""}">✓ Funcionou</button>
    <button class="${st==="fail"?"fail":""}">✗ Tem problema</button>
    <span style="flex:1"></span><button class="primary">Próximo →</button></div>`);
  const [b1,b2,b3] = el.querySelectorAll("button");
  b1.onclick=()=>setResult(id,"ok"); b2.onclick=()=>setResult(id,"fail");
  b3.onclick=()=>{ const i=TESTS.findIndex(t=>t.id===id); go(TESTS[i+1].id); };
  return el;
}
function go(id){
  if(cleanup){ try{cleanup();}catch(e){} cleanup=null; }
  current=id; history.replaceState(null,"","#"+id);
  const main=$("#main"); main.innerHTML="";
  PAGES[id](main);
  renderNav(); window.scrollTo(0,0);
}

/* ---------------- sistema ---------------- */
function fmtCores(v){ const m=String(v||"").match(/(\d+):(\d+):(\d+)/); return m?`${m[1]} (${m[2]} desempenho + ${m[3]} eficiência)`:v; }
function sysData(){
  const S = window.SYSINFO; if(!S) return null;
  const sp = S.sp || {};
  const first = k => (sp[k]||[])[0] || {};
  const hw = first("SPHardwareDataType"), sw = first("SPSoftwareDataType");
  const pw = (sp.SPPowerDataType||[]).find(x=>x.sppower_battery_health_info) || {};
  const bh = pw.sppower_battery_health_info || {};
  const io = {};
  (S.batteryIoreg||"").split("\n").forEach(l=>{ const m=l.match(/"(\w+)" = (\d+)/); if(m) io[m[1]]=+m[2]; });
  let maxCap = bh.sppower_battery_health_maximum_capacity || "";
  if(!maxCap && io.DesignCapacity && (io.AppleRawMaxCapacity||io.MaxCapacity>100)){
    maxCap = Math.round(100*(io.AppleRawMaxCapacity||io.MaxCapacity)/io.DesignCapacity)+"%";
  }
  const storage = (sp.SPStorageDataType||[]).find(v=>v.mount_point==="/") || (sp.SPStorageDataType||[])[0] || {};
  const nvme = ((sp.SPNVMeDataType||[])[0]||{})._items?.[0] || {};
  const smart = (storage.physical_drive||{}).smart_status || nvme.smart_status || (S.smartDiskutil||"").split(":").slice(1).join(":").trim();
  const disp = ((sp.SPDisplaysDataType||[])[0]||{}).spdisplays_ndrvs || [];
  const internal = disp.find(d=>/internal|built-in/i.test((d.spdisplays_connection_type||"")+(d.spdisplays_display_type||"")+(d._name||""))) || disp[0] || {};
  const cams = (sp.SPCameraDataType||[]).map(c=>c._name).join(", ");
  const gb = b => b ? (b/1e9).toFixed(0)+" GB" : "";
  const al = hw.activation_lock_status || "";
  return {
    rows:[
      ["Modelo", [hw.machine_name, hw.model_number].filter(Boolean).join(" · ")],
      ["Identificador", hw.machine_model],
      ["Chip / processador", hw.chip_type || [hw.cpu_type, hw.current_processor_speed].filter(Boolean).join(" ")],
      ["Núcleos", fmtCores(hw.number_processors)],
      ["Memória (RAM)", hw.physical_memory],
      ["Armazenamento", [gb(storage.size_in_bytes), storage.free_space_in_bytes ? gb(storage.free_space_in_bytes)+" livres":""].filter(Boolean).join(" · ")],
      ["Número de série", hw.serial_number],
      ["macOS", sw.os_version],
      ["Tela", [internal._name, internal._spdisplays_resolution || internal.spdisplays_resolution].filter(Boolean).join(" · ")],
      ["Câmera", cams],
      ["Ciclos da bateria", bh.sppower_battery_cycle_count ?? io.CycleCount],
      ["Condição da bateria", bh.sppower_battery_health],
      ["Capacidade máxima", maxCap],
      ["Saúde do SSD (S.M.A.R.T.)", smart],
      ["Bloqueio de Ativação", al.replace("activation_lock_","")],
      ["Gerenciamento (MDM)", (S.mdm||"").replace(/\n/g," · ")],
    ].filter(r=>r[1]!==undefined && r[1]!==""),
    cycles: +(bh.sppower_battery_cycle_count ?? io.CycleCount ?? NaN),
    condition: bh.sppower_battery_health || "",
    maxCap: parseInt(maxCap) || NaN,
    smart, al, mdm: S.mdm||"", serial: hw.serial_number||"", raw:S, generatedAt:S.generatedAt
  };
}
function sysAlerts(d){
  const a=[];
  if(/enabled/i.test(d.al)) a.push(["bad","🔒 Bloqueio de Ativação LIGADO. O Mac está preso à conta iCloud de alguém. Só compre se o vendedor sair da conta e desligar o Buscar Mac na sua frente."]);
  if(/MDM enrollment: Yes|Enrolled via DEP: Yes/i.test(d.mdm)) a.push(["bad","🏢 Este Mac é gerenciado por uma empresa (MDM). Ele pode ser bloqueado ou apagado remotamente."]);
  if(d.smart && !/verified|verificado/i.test(d.smart)) a.push(["bad","💾 O SSD não passou no S.M.A.R.T. ("+d.smart+"). Risco de falha de disco."]);
  if(d.condition && !/normal|good/i.test(d.condition)) a.push(["warn","🔋 Condição da bateria: "+d.condition+". Provavelmente precisa trocar."]);
  if(d.maxCap && d.maxCap<80) a.push(["warn","🔋 A capacidade máxima está em "+d.maxCap+"%. Abaixo de 80% a Apple recomenda trocar a bateria."]);
  if(d.cycles>1000) a.push(["warn","🔋 "+d.cycles+" ciclos. Passou do limite de 1000 da Apple."]);
  else if(d.cycles>700) a.push(["warn","🔋 "+d.cycles+" ciclos. É bastante uso; negocie o preço."]);
  if(!a.length) a.push(["good","Nenhum problema encontrado nos dados do sistema."]);
  return a;
}
const PAGES = {};
PAGES.sistema = m=>{
  m.append(h(`<div><h2>🧾 Sistema e bateria</h2><p class="lead">Dados lidos direto do Mac pelo script do terminal.</p></div>`));
  const d = sysData();
  if(!d){
    m.append(h(`<div class="card"><div class="alert warn">Sem dados de hardware. Esta página não foi aberta pelo script do terminal.</div>
      <p>No Mac que você vai testar, abra o <b>Terminal</b> e rode:</p>
      <pre>curl -fsSL https://raw.githubusercontent.com/vianx7/mods-claude/main/macbook-checker/install.sh | bash</pre>
      <p class="muted">Se não puder usar o terminal, pegue os mesmos dados em  → Sobre Este Mac → Mais Informações → Relatório do Sistema (Bateria, Armazenamento, Hardware).</p></div>`));
    m.append(verdict("sistema")); return;
  }
  const al = h(`<div class="card"></div>`);
  sysAlerts(d).forEach(([c,t])=>al.append(h(`<div class="alert ${c}">${esc(t)}</div>`)));
  m.append(al);
  const tb = h(`<div class="card"><table></table><p class="muted" style="margin:10px 0 0">Lido em ${esc(d.generatedAt)}. Confira se o número de série bate com a caixa/nota fiscal e consulte em <b>checkcoverage.apple.com</b>.</p></div>`);
  d.rows.forEach(([k,v])=>$("table",tb).append(h(`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`)));
  m.append(tb);
  m.append(h(`<details class="card"><summary class="muted" style="cursor:pointer">Ver dados brutos</summary><pre>${esc(JSON.stringify(d.raw,null,1))}</pre></details>`));
  if(!state.results.sistema){ state.results.sistema = sysAlerts(d).some(x=>x[0]==="bad")?"fail":sysAlerts(d).some(x=>x[0]==="warn")?"warn":"ok"; save(); }
  m.append(verdict("sistema"));
};

/* ---------------- teclado ---------------- */
const F = n=>({c:"F"+n,l:"F"+n,fn:1});
const KB = [
  [{c:"Escape",l:"esc",fn:1,w:1.4},F(1),F(2),F(3),F(4),F(5),F(6),F(7),F(8),F(9),F(10),F(11),F(12)],
  [["Backquote","`"],["Digit1","1"],["Digit2","2"],["Digit3","3"],["Digit4","4"],["Digit5","5"],["Digit6","6"],["Digit7","7"],["Digit8","8"],["Digit9","9"],["Digit0","0"],["Minus","-"],["Equal","="],{c:"Backspace",l:"delete",w:1.6}],
  [{c:"Tab",l:"tab",w:1.6},..."QWERTYUIOP".split("").map(x=>["Key"+x,x]),["BracketLeft","["],["BracketRight","]"],{c:"Backslash",l:"\\",w:1.0}],
  [{c:"CapsLock",l:"caps lock",w:1.9},..."ASDFGHJKL".split("").map(x=>["Key"+x,x]),["Semicolon",";"],["Quote","'"],{c:"Enter",l:"return",w:1.9}],
  [{c:"ShiftLeft",l:"shift",w:2.5},..."ZXCVBNM".split("").map(x=>["Key"+x,x]),["Comma",","],["Period","."],["Slash","/"],{c:"ShiftRight",l:"shift",w:2.5}],
  [{c:"Fn",l:"fn",opt:1},{c:"ControlLeft",l:"control"},{c:"AltLeft",l:"option"},{c:"MetaLeft",l:"command",w:1.3},{c:"Space",l:"",w:5.2},{c:"MetaRight",l:"command",w:1.3},{c:"AltRight",l:"option"},{c:"ArrowLeft",l:"◀"},{stack:[{c:"ArrowUp",l:"▲"},{c:"ArrowDown",l:"▼"}]},{c:"ArrowRight",l:"▶"}],
].map(r=>r.map(k=>Array.isArray(k)?{c:k[0],l:k[1]}:k));
PAGES.teclado = m=>{
  m.append(h(`<div><h2>⌨️ Teclado</h2><p class="lead">Aperte <b>todas</b> as teclas, uma por uma. Cada tecla que funcionar fica verde.</p></div>`));
  m.append(h(`<div class="card"><div class="alert warn" style="margin-top:0">
    <b>Dicas:</b> para a fileira F1–F12, segure <b>fn</b> (senão o Mac usa como brilho/volume e o navegador não vê).
    Evite <b>⌘Q</b>, <b>⌘W</b> e <b>⌘Tab</b> — fecham ou trocam a janela. A tecla <b>fn</b> e o <b>Touch ID</b> não são detectáveis pelo navegador (teste o Touch ID em "Portas e físico").
    Fique de olho em teclas que <b>repetem sozinhas</b> ou precisam de força: veja o histórico abaixo.</div>
    <div class="kb" id="kb"></div>
    <div class="row" style="margin-top:12px"><div class="progress"><i id="kbBar"></i></div><b id="kbCount"></b><button id="kbReset">Recomeçar</button></div>
    <p id="keylog"></p><div id="kbExtra" class="muted"></div></div>`));
  const kbEl=$("#kb"), keys={}; const pressed=new Set(), extra=new Set();
  const mk = k=>{ const e=h(`<div class="k${k.fn?" fn":""}${k.opt?" opt":""}" style="flex-grow:${k.w||1}">${esc(k.l)}</div>`); keys[k.c]=e; return e; };
  KB.forEach(r=>{ const re=h(`<div class="kr"></div>`); r.forEach(k=>{
    if(k.stack){ const s=h(`<div class="stack"></div>`); k.stack.forEach(x=>{const e=mk(x); e.classList.remove("fn"); s.append(e);}); re.append(s); }
    else re.append(mk(k)); }); kbEl.append(re); });
  const required = KB.flat().flatMap(k=>k.stack||[k]).filter(k=>!k.opt).map(k=>k.c);
  const log=[];
  const upd=()=>{ const n=required.filter(c=>pressed.has(c)).length;
    $("#kbBar").style.width=(100*n/required.length)+"%"; $("#kbCount").textContent=n+" / "+required.length;
    $("#kbExtra").textContent = extra.size? "Outras teclas detectadas: "+[...extra].join(", "):"";
    if(n===required.length && !state.results.teclado) setResult("teclado","ok"); };
  const kd = e=>{
    if(e.metaKey && /^(KeyQ|KeyW|KeyH|KeyM|Tab)$/.test(e.code)) return;
    e.preventDefault();
    const c = e.code || e.key; pressed.add(c);
    if(keys[c]) keys[c].classList.add("on","down"); else extra.add(c);
    log.unshift(c+(e.repeat?" (repetindo)":"")); log.length=Math.min(log.length,12);
    $("#keylog").textContent = "Últimas: "+log.join("  ·  "); upd(); };
  const ku = e=>{ const c=e.code||e.key; if(keys[c]) keys[c].classList.remove("down");
    if(c==="CapsLock"){ pressed.add(c); keys[c]?.classList.add("on"); upd(); }
    if(c==="MetaLeft"||c==="MetaRight") Object.values(keys).forEach(k=>k.classList.remove("down")); };
  window.addEventListener("keydown",kd); window.addEventListener("keyup",ku);
  $("#kbReset").onclick=()=>{ pressed.clear(); extra.clear(); Object.values(keys).forEach(k=>k.classList.remove("on","down")); upd(); };
  cleanup=()=>{ window.removeEventListener("keydown",kd); window.removeEventListener("keyup",ku); };
  upd(); m.append(verdict("teclado"));
};

  const mark=k=>{ if(!done.has(k)){ done.add(k); renderC(); } };
  const tp=$("#tp"), c1=$("#cv1"), c2=$("#cv2"), x1=c1.getContext("2d"), x2=c2.getContext("2d");
  const COLS=16, ROWS=8, seen=new Set(); let W,H,dpr;
  const size=()=>{ dpr=devicePixelRatio||1; W=tp.clientWidth; H=tp.clientHeight; [c1,c2].forEach(cv=>{cv.width=W*dpr;cv.height=H*dpr;});
    x1.setTransform(dpr,0,0,dpr,0,0); x2.setTransform(dpr,0,0,dpr,0,0); grid(); };
  const grid=()=>{ x1.clearRect(0,0,W,H); const cw=W/COLS, ch=H/ROWS;
    for(let r=0;r<ROWS;r++)for(let q=0;q<COLS;q++){ x1.fillStyle=seen.has(r*COLS+q)?"rgba(52,199,89,.22)":"rgba(255,255,255,.02)"; x1.fillRect(q*cw+1,r*ch+1,cw-2,ch-2); } };
  size(); const ro=new ResizeObserver(size); ro.observe(tp);
  let down=false, last=null, scale=1;
  const pos=e=>{ const r=tp.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; };
  tp.addEventListener("mousemove",e=>{ const [x,y]=pos(e); const id=Math.min(ROWS-1,Math.floor(y/H*ROWS))*COLS+Math.min(COLS-1,Math.floor(x/W*COLS));
    if(!seen.has(id)){ seen.add(id); grid(); if(seen.size>=COLS*ROWS*0.9) mark("cover"); }
    if(down&&last){ x2.strokeStyle="#4c8dff"; x2.lineWidth=3; x2.lineCap="round"; x2.beginPath(); x2.moveTo(...last); x2.lineTo(x,y); x2.stroke();
      if(Math.hypot(x-dragStart[0],y-dragStart[1])>60) mark("drag"); }
    last=[x,y]; });
  let dragStart=[0,0];
  tp.addEventListener("mousedown",e=>{ if(e.button===0){down=true; last=pos(e); dragStart=last;} });
  window.addEventListener("mouseup",()=>down=false);

  cleanup=()=>ro.disconnect();
  renderC(); m.append(verdict("trackpad"));
};

let actx=null;
const ac=()=>{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); return actx; };
function tone({pan=0,freq=440,dur=1.2,sweep=0,type="sine"}){
  const a=ac(), o=a.createOscillator(), g=a.createGain(), t=a.currentTime;
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(sweep) o.frequency.exponentialRampToValueAtTime(sweep,t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.35,t+.05); g.gain.setValueAtTime(.35,t+dur-.08); g.gain.linearRampToValueAtTime(0,t+dur);
  let node=o.connect(g);
  if(a.createStereoPanner){ const p=a.createStereoPanner(); p.pan.value=pan; node.connect(p); p.connect(a.destination); }
  else node.connect(a.destination);
  o.start(t); o.stop(t+dur+.02); return o;
}
/* música de teste: gerada aqui mesmo (bateria, baixo, acordes e arpejo) */
const Music=(()=>{
  let a=null, master=null, panner=null, timer=0, step=0, next=0, noise=null, playing=false, pan=0, vol=.8;
  const S=60/100/4;                                   // semicolcheia a 100 BPM
  const mf=n=>440*Math.pow(2,(n-69)/12);
  const PROG=[[36,[60,64,67]],[43,[59,62,67]],[45,[60,64,69]],[41,[60,65,69]]]; // C G Am F
  const ARP=[0,1,2,1,0,2,1,2];
  function note(t,f,d,type,g,lp){ const o=a.createOscillator(), e=a.createGain(); o.type=type; o.frequency.value=f;
    e.gain.setValueAtTime(0,t); e.gain.linearRampToValueAtTime(g,t+.012); e.gain.exponentialRampToValueAtTime(.0001,t+d);
    let n=o; if(lp){ const fl=a.createBiquadFilter(); fl.type="lowpass"; fl.frequency.value=lp; o.connect(fl); n=fl; }
    n.connect(e); e.connect(master); o.start(t); o.stop(t+d+.05); }
  function kick(t){ const o=a.createOscillator(), e=a.createGain(); o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(40,t+.2);
    e.gain.setValueAtTime(1,t); e.gain.exponentialRampToValueAtTime(.001,t+.4); o.connect(e); e.connect(master); o.start(t); o.stop(t+.45); }
  function hit(t,d,g,hp){ const s=a.createBufferSource(); s.buffer=noise; const f=a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    const e=a.createGain(); e.gain.setValueAtTime(g,t); e.gain.exponentialRampToValueAtTime(.001,t+d); s.connect(f); f.connect(e); e.connect(master); s.start(t); s.stop(t+d+.02); }
  function tick(){
    while(next < a.currentTime+.2){
      const t=next, s=step%16, [root,ch]=PROG[Math.floor(step/16)%4];
      if(s===0||s===8||s===10) kick(t);
      if(s===4||s===12){ hit(t,.18,.5,1200); note(t,180,.08,"triangle",.25); }
      if(s%2===0) hit(t,.05,s%4===2?.22:.12,7000);
      if(s%2===0) note(t,mf(root+(s===6||s===14?12:0)),S*1.7,"sawtooth",.32,520);
      if(s===0) ch.forEach(n=>note(t,mf(n),S*16,"triangle",.07,1800));
      if(s%2===0) note(t,mf(ch[ARP[s/2]]+12),S*1.6,"triangle",.13);
      if(Math.floor(step/16)%2===1 && (s===0||s===3||s===6)) note(t,mf(ch[s/3]+24),S*2.5,"sine",.09);
      next+=S; step++;
    }
  }
  return {
    get playing(){ return playing; },
    start(){ if(playing) return; a=ac();
      if(!noise){ noise=a.createBuffer(1,a.sampleRate,a.sampleRate); const d=noise.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
      master=a.createGain(); master.gain.value=vol*.55;
      panner=a.createStereoPanner ? a.createStereoPanner() : null;
      if(panner){ panner.pan.value=pan; master.connect(panner); panner.connect(a.destination); } else master.connect(a.destination);
      step=0; next=a.currentTime+.06; tick(); timer=setInterval(tick,25); playing=true; },
    stop(){ if(!playing) return; clearInterval(timer); const m=master; m.gain.setTargetAtTime(0,a.currentTime,.04); setTimeout(()=>m.disconnect(),400); playing=false; },
    setPan(p){ pan=p; if(panner) panner.pan.setTargetAtTime(p,a.currentTime,.015); },
    setVol(v){ vol=v; if(master) master.gain.setTargetAtTime(v*.55,a.currentTime,.03); },
    get canPan(){ return !!(window.AudioContext||window.webkitAudioContext).prototype.createStereoPanner; }
  };
})();

    r.start(); let n=5; $("#msg",c).textContent="Gravando... 5";

function setDetail(id,txt){ state.details[id]=txt; save(); }
function fmtAgo(sec){ const d=Math.floor(sec/86400); return d<1?"hoje":d===1?"ontem":d<60?`há ${d} dias`:d<730?`há ${Math.round(d/30)} meses`:`há ${Math.round(d/365)} anos`; }
function findAll(o,fn,out=[]){ if(o&&typeof o==="object"){ if(fn(o)) out.push(o); for(const k in o) findAll(o[k],fn,out); } return out; }

/* ---------------- extras ---------------- */
PAGES.extras = m=>{
  m.append(h(`<div><h2>🔌 Portas e físico</h2><p class="lead">Primeiro as portas (a página detecta sozinha), depois o checklist do que dá pra ver com os olhos.</p></div>`));
  const live=h(`<div class="card"><p style="margin-top:0"><b>⚡ Ao vivo:</b> plugue o carregador em <b>cada porta USB-C</b>, uma de cada vez, e veja se aparece "carregando". Depois plugue um pendrive, HD ou o seu celular em cada porta e veja se aparece na lista.</p>
    <div class="stat"><div><b id="pw">…</b><span>Energia</span></div><div><b id="bt">…</b><span>Bateria</span></div><div><b id="wt">—</b><span>Carregador</span></div></div>
    <div><span class="muted">Dispositivos USB conectados:</span> <span id="usb">…</span></div>
    <p class="muted" style="margin-bottom:0">Obs.: com "Carregamento otimizado" ligado, o Mac pode segurar a bateria em 80% e mostrar "não está carregando" — normal. O importante é aparecer "Na tomada".</p></div>`);
  m.append(live);
  let alive=true, timers=[];
  const pollPower=async()=>{ try{ const r=await api("power");
      const ac=/AC Power/i.test(r.batt), pct=(r.batt.match(/(\d+)%/)||[])[1], st=((r.batt.match(/\d+%;\s*([^;]+);/)||[])[1]||"").trim();
      const w=(r.ac.match(/Wattage\s*=\s*(\d+)/i)||[])[1];
      const ST={charging:"carregando",discharging:"descarregando",charged:"carregada","AC attached":"na tomada, não está carregando","finishing charge":"terminando a carga"};
      $("#pw",live).innerHTML=ac?`<span style="color:var(--ok)">🔌 Na tomada</span>`:"🔋 Na bateria";
      $("#bt",live).textContent=(pct?pct+"% ":"")+(ST[st]||st);
      $("#wt",live).textContent=ac&&w?w+" W":"—";
    }catch(e){ live.innerHTML=NO_SERVER; alive=false; } };
  const pollUsb=async()=>{ if(!alive) return; try{ const r=await api("usb"); let names=[];
      try{ const j=JSON.parse(r.json||"{}"); names=findAll(j,o=>o._name && !o._items && !/bus|controller|hub|root/i.test(o._name)).map(o=>o._name); }catch(e){}
      $("#usb",live).innerHTML=names.length?names.map(n=>`<span class="pill">${esc(n)}</span>`).join(" "):"<span class='muted'>nenhum</span>";
    }catch(e){} };
  pollPower(); pollUsb(); timers.push(setInterval(pollPower,2500), setInterval(pollUsb,4000));
  cleanup=()=>timers.forEach(clearInterval);

  const c=h(`<div class="card"></div>`); m.append(c);
  const draw=()=>{ c.innerHTML=""; MANUAL.forEach(([k,t,d])=>{ const v=state.manual[k];
    const row=h(`<div class="mitem"><div class="t">${esc(t)}<small>${esc(d)}</small></div><div class="seg">
      <button class="${v==="ok"?"ok":""}">✓ OK</button><button class="${v==="fail"?"fail":""}">✗ Problema</button><button class="${v==="na"?"ok":""}" title="Não se aplica">N/A</button></div></div>`);
    const [a,b,n]=row.querySelectorAll("button");
    a.onclick=()=>{state.manual[k]="ok";save();draw();}; b.onclick=()=>{state.manual[k]="fail";save();draw();}; n.onclick=()=>{state.manual[k]="na";save();draw();};
    c.append(row); }); };
  draw();
  const nx=h(`<div class="verdict"><span class="muted">Básico pronto! Agora os testes avançados.</span><span style="flex:1"></span><button class="primary">Próximo →</button></div>`);
  nx.querySelector("button").onclick=()=>go("travamentos"); m.append(nx);
};

/* ---------------- travamentos ---------------- */
PAGES.travamentos = m=>{
  m.append(h(`<div><h2>💥 Travamentos</h2><p class="lead">Procura no Mac registros de <b>kernel panic</b> — quando ele trava e reinicia sozinho. É o melhor jeito de achar defeito de placa que o vendedor não conta.</p></div>`));
  const c=h(`<div class="card"><p class="muted" style="margin:0">Verificando…</p></div>`); m.append(c);
  api("panics").then(r=>{
    const recent=r.panics.filter(p=>r.now-p.time<90*86400);
    const setupAgo=r.setupDone? r.now-r.setupDone : null;
    let html="";
    if(!r.readable) html+=`<div class="alert warn">Não consegui ler a pasta de relatórios (o usuário logado não é administrador). Resultado inconclusivo.</div>`;
    else if(!r.panics.length) html+=`<div class="alert good">Nenhum kernel panic registrado. 👍</div>`;
    else if(recent.length) html+=`<div class="alert bad">${recent.length} travamento(s) nos últimos 3 meses. Pergunte ao vendedor e desconfie: pode ser defeito de placa, memória ou SSD.</div>`;
    else html+=`<div class="alert warn">${r.panics.length} travamento(s) antigo(s), nenhum nos últimos 3 meses.</div>`;
    if(setupAgo!==null) html+=`<p>macOS configurado <b>${fmtAgo(setupAgo)}</b>${setupAgo<30*86400?` — <span style="color:var(--warn)">foi formatado há pouco, então o histórico está quase vazio e este teste diz pouco. Faça o teste de estresse com mais atenção.</span>`:"."}</p>`;
    if(r.panics.length) html+=`<table>${r.panics.slice(0,12).map(p=>`<tr><td>${new Date(p.time*1000).toLocaleString("pt-BR")}</td><td>${esc(p.name)}</td></tr>`).join("")}</table>`;
    html+=`<p class="muted">Travamentos de apps (não graves): ${r.crashes}</p>`;
    if(r.reboots) html+=`<details><summary class="muted" style="cursor:pointer">Últimos desligamentos/reinícios</summary><pre>${esc(r.reboots)}</pre></details>`;
    c.innerHTML=html;
    if(!state.results.travamentos && r.readable){ setResult("travamentos", recent.length?"fail":r.panics.length?"warn":"ok"); }
    setDetail("travamentos", r.panics.length? `${r.panics.length} panic(s), ${recent.length} recente(s)` : "nenhum panic");
  }).catch(()=>c.innerHTML=NO_SERVER);
  m.append(verdict("travamentos"));
};

/* ---------------- wi-fi ---------------- */
PAGES.wifi = m=>{
  m.append(h(`<div><h2>📶 Velocidade Wi-Fi</h2><p class="lead">Mede a internet pelo Wi-Fi do Mac com a ferramenta da própria Apple. Leva uns 20 segundos.</p></div>`));
  const c=h(`<div class="card"><button class="primary" id="go">▶ Medir velocidade</button> <span class="muted" id="msg"></span>
    <div class="stat" id="res"></div>
    <p class="muted" style="margin-bottom:0">Depende da internet do lugar. Compare com o seu celular <b>no mesmo Wi-Fi</b> (fast.com): o Mac deve dar parecido ou mais. Muito abaixo = antena ou placa Wi-Fi com problema.</p></div>`);
  m.append(c);
  $("#go",c).onclick=async()=>{ const b=$("#go",c); b.disabled=true; let n=0; const iv=setInterval(()=>$("#msg",c).textContent=`Medindo… ${++n}s`,1000);
    try{ const r=await api("wifi"); if(r.error) throw new Error(r.error);
      const j=JSON.parse(r.json); const mb=x=>x?(x/1e6).toFixed(0):"—";
      $("#res",c).innerHTML=`<div><b>${mb(j.dl_throughput)} Mbps</b><span>Download</span></div><div><b>${mb(j.ul_throughput)} Mbps</b><span>Upload</span></div>`+
        (j.responsiveness||j.dl_responsiveness?`<div><b>${Math.round(j.responsiveness||j.dl_responsiveness)}</b><span>Resposta (RPM)</span></div>`:"");
      $("#msg",c).textContent="Pronto ✓"; setDetail("wifi",`↓ ${mb(j.dl_throughput)} / ↑ ${mb(j.ul_throughput)} Mbps`);
      if(!state.results.wifi && j.dl_throughput>1e6) setResult("wifi","ok");
    }catch(e){ $("#msg",c).textContent=""; $("#res",c).innerHTML=/sem servidor/.test(e.message)?NO_SERVER:`<div class="alert warn">${esc(e.message)} Está conectado num Wi-Fi?</div>`; }
    clearInterval(iv); b.disabled=false; };
  m.append(verdict("wifi"));
};

/* ---------------- ssd ---------------- */
PAGES.ssd = m=>{
  m.append(h(`<div><h2>💾 Velocidade do SSD</h2><p class="lead">Grava um arquivo de 2 GB, mede a velocidade e apaga em seguida. Leva poucos segundos.</p></div>`));
  const c=h(`<div class="card"><button class="primary" id="go">▶ Testar SSD</button> <span class="muted" id="msg"></span><div id="res"></div>
    <p class="muted" style="margin-bottom:0">Referência para M1: <b>acima de 1.500 MB/s</b> é o normal (o de 256 GB é um pouco mais lento que os maiores). Abaixo de 500 MB/s, desconfie.</p></div>`);
  m.append(c);
  $("#go",c).onclick=async()=>{ const b=$("#go",c); b.disabled=true; $("#msg",c).textContent="Gravando 2 GB…";
    try{ const r=await api("ssd"); if(r.error) throw new Error(r.error);
      const v=Math.round(r.mbps), cls=v>=1500?"good":v>=500?"warn":"bad";
      $("#res",c).innerHTML=`<div class="stat"><div><b>${v.toLocaleString("pt-BR")} MB/s</b><span>Gravação</span></div><div><b>${r.secs.toFixed(1)} s</b><span>para 2 GB</span></div></div>
        <div class="alert ${cls}">${cls==="good"?"Velocidade normal. 👍":cls==="warn"?"Mais lento que o esperado. Feche outros apps e teste de novo.":"Muito lento: pode ser SSD desgastado ou com defeito."}</div>`;
      $("#msg",c).textContent="Pronto ✓"; setDetail("ssd",`${v} MB/s`);
      if(!state.results.ssd) setResult("ssd",cls==="good"?"ok":cls==="warn"?"warn":"fail");
    }catch(e){ $("#msg",c).textContent=""; $("#res",c).innerHTML=/sem servidor/.test(e.message)?NO_SERVER:`<div class="alert warn">${esc(e.message)}</div>`; }
    b.disabled=false; };
  m.append(verdict("ssd"));
};

/* ---------------- estresse ---------------- */
PAGES.estresse = m=>{
  m.append(h(`<div><h2>🔥 Teste de estresse</h2><p class="lead">Coloca todos os núcleos do processador no máximo por 90 segundos. Mac com defeito costuma travar, reiniciar ou desligar aqui.</p></div>`));
  const c=h(`<div class="card"><div class="alert warn" style="margin-top:0"><b>Antes:</b> ligue o carregador. Durante o teste o Mac vai <b>esquentar</b> (normal). No MacBook Pro a ventoinha acelera — deve fazer só barulho de vento, nunca de raspado. O MacBook Air não tem ventoinha.</div>
    <button class="primary" id="go">▶ Começar (90 s)</button> <span class="muted" id="msg"></span>
    <div class="row" style="margin-top:14px"><div class="progress"><i id="bar"></i></div><b id="left"></b></div>
    <p class="muted" id="hb" style="margin-bottom:0"></p><div id="res"></div></div>`);
  m.append(c);
  let iv=0;
  $("#go",c).onclick=async()=>{ const b=$("#go",c), S=90; b.disabled=true; const t0=Date.now(); let worst=0, last=Date.now();
    iv=setInterval(()=>{ const now=Date.now(), el=(now-t0)/1000; worst=Math.max(worst,now-last-250); last=now;
      $("#bar",c).style.width=Math.min(100,el/S*100)+"%"; $("#left",c).textContent=Math.max(0,Math.ceil(S-el))+" s";
      $("#hb",c).textContent=`Tela respondendo ✓ (maior engasgo: ${Math.max(0,worst)} ms)`; },250);
    $("#msg",c).textContent="Rodando… não feche esta página.";
    try{ const r=await api("stress","s="+S); if(r.error) throw new Error(r.error);
      const lim=(r.after.match(/CPU_Speed_Limit\s*=\s*(\d+)/)||[])[1];
      $("#res",c).innerHTML=`<div class="alert good">Aguentou ${r.secs} s com ${r.cpus} núcleos no máximo sem travar. 👍</div>`+
        (lim&&+lim<100?`<div class="alert warn">O Mac reduziu a velocidade para ${lim}% por temperatura.</div>`:"")+
        `<p class="muted">Encoste a mão embaixo do Mac: quente é normal; <b>quente demais pra segurar</b> ou cheiro de queimado não é.</p>`;
      $("#msg",c).textContent="Pronto ✓"; setDetail("estresse",`${r.secs}s, ${r.cpus} núcleos, sem travar`);
      if(!state.results.estresse) setResult("estresse","ok");
    }catch(e){ $("#msg",c).textContent=""; $("#res",c).innerHTML=/sem servidor/.test(e.message)?NO_SERVER:`<div class="alert warn">${esc(e.message)}</div>`; }
    clearInterval(iv); b.disabled=false; };
  cleanup=()=>clearInterval(iv);
  m.append(verdict("estresse"));
};

/* ---------------- relatório ---------------- */
const LBL={ok:"✓ OK",fail:"✗ Problema",warn:"⚠ Atenção",pending:"— Não testado",na:"N/A"};
function reportText(){
  const d=sysData(); const L=[];
  L.push("RELATÓRIO MACBOOK CHECKER — "+new Date().toLocaleString("pt-BR"));
  if(d){ d.rows.forEach(([k,v])=>L.push(k+": "+v)); L.push(""); sysAlerts(d).forEach(a=>L.push("• "+a[1])); }
  L.push(""); TESTS.filter(t=>t.id!=="relatorio"&&t.id!=="extras").forEach(t=>L.push(t.name+": "+LBL[statusOf(t.id)]+(state.details[t.id]?" ("+state.details[t.id]+")":"")));
  L.push(""); MANUAL.forEach(([k,t])=>L.push(t+": "+LBL[state.manual[k]||"pending"]));
  if(state.notes) L.push("", "Observações: "+state.notes);
  return L.join("\n");
}
PAGES.relatorio = m=>{
  const all=TESTS.filter(t=>t.id!=="relatorio").map(t=>statusOf(t.id));
  const fails=all.filter(s=>s==="fail").length, pend=all.filter(s=>s==="pending").length;
  m.append(h(`<div><h2>📋 Relatório</h2><p class="lead">${fails?`<b style="color:var(--fail)">${fails} item(ns) com problema.</b> Use isso para negociar ou desistir.`:pend?`Faltam ${pend} teste(s).`:`<b style="color:var(--ok)">Tudo certo!</b> Nenhum problema encontrado.`}</p></div>`));
  const c=h(`<div class="card rep"><table></table></div>`); m.append(c);
  const tb=$("table",c);
  TESTS.filter(t=>t.id!=="relatorio").forEach(t=>{ const s=statusOf(t.id);
    const r=h(`<tr><td>${t.icon} ${t.name}${state.details[t.id]?` <span class="muted">· ${esc(state.details[t.id])}</span>`:""}</td><td><span class="tag ${s}">${LBL[s]}</span></td></tr>`); r.style.cursor="pointer"; r.onclick=()=>go(t.id); tb.append(r); });
  MANUAL.filter(([k])=>state.manual[k]==="fail").forEach(([k,t])=>tb.append(h(`<tr><td>&nbsp;&nbsp;↳ ${esc(t)}</td><td><span class="tag fail">✗ Problema</span></td></tr>`)));
  const n=h(`<div class="card"><p style="margin-top:0">Observações (ex.: risco na tampa, tecla "E" dura):</p><textarea style="width:100%;min-height:80px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit"></textarea>
    <div class="row" style="margin-top:12px"><button class="primary" id="copy">Copiar relatório</button><button id="print">Imprimir / salvar PDF</button><span style="flex:1"></span><button id="reset">Apagar tudo e recomeçar</button></div></div>`);
  m.append(n);
  const ta=$("textarea",n); ta.value=state.notes||""; ta.oninput=()=>{state.notes=ta.value; try{localStorage.setItem("mbc-state",JSON.stringify(state));}catch(e){}};
  $("#copy",n).onclick=async()=>{ try{ await navigator.clipboard.writeText(reportText()); $("#copy",n).textContent="Copiado ✓"; }catch(e){ prompt("Copie:",reportText()); } };
  $("#print",n).onclick=()=>window.print();
  $("#reset",n).onclick=()=>{ if(confirm("Apagar todos os resultados?")){ state={results:{},manual:{},details:{},notes:""}; save(); go("sistema"); } };
};

window.addEventListener("hashchange",()=>{ const id=location.hash.slice(1); if(id!==current && PAGES[id]) go(id); });
go(current);
</script>
